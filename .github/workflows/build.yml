name: Build Minecraft Mod 1.13.2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Скачивание кода
      uses: actions/checkout@v4

    - name: Настройка Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Выдача прав на выполнение Gradlew
      run: chmod +x gradlew || true

    - name: Сборка .jar файла
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew build --no-daemon
        else
          gradle build --no-daemon
        fi

    - name: Сохранение готового .jar
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Mod-1.13.2-JAR
        path: build/libs/*.jar
